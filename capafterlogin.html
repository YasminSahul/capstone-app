<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yashz Mart</title>

    <link rel="stylesheet" href="capstyle.css">

</head>

<body>

    <header class="main-header">

        <div class="logo">
            Yashz Mart
        </div>

        <div class="header-buttons">

            <button id="cartButton">
                🛒 Cart
            </button>

            <button id="settingsButton">
                ⚙ Settings
            </button>

        </div>

    </header>


    <section class="welcome-section">

        <h1>Yashz Mart Marketplace</h1>

        <p>
            Customized products for everyone
        </p>

    </section>


    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <button id="searchButton">
            Search
        </button>

    </section>


    <section class="categories">

        <button class="category-btn">
            All
        </button>

        <button class="category-btn">
            Sports
        </button>

        <button class="category-btn">
            Women
        </button>

        <button class="category-btn">
            Men
        </button>

        <button class="category-btn">
            Kids
        </button>

        <button class="category-btn">
            Toys & Gifts
        </button>

        <button class="category-btn">
            Accessories
        </button>

    </section>


    <main class="products-section">

        <h2>
            Products
        </h2>

        <div
            id="productGrid"
            class="product-grid"
        >

            <div class="product-card">

                <div class="product-image">
                    🛍️
                </div>

                <h3>
                    Sample Product
                </h3>

                <p>
                    ₹499
                </p>

                <button>
                    View
                </button>

            </div>

        </div>

    </main>


    <script src="capscript.js"></script>

</body>

</html>
