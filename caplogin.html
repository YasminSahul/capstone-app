<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yashz Mart - Login</title>
    <link rel="stylesheet" href="capstyle.css">
</head>

<body class="auth-body">

<div class="auth-box">

    <div class="logo">🛍️</div>

    <h1>Yashz Mart</h1>
    <p class="welcome">Login to your marketplace</p>

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email ID</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >

        <label>Login As</label>

        <select id="loginRole" required>
            <option value="BUYER">Buyer</option>
            <option value="SELLER">Seller</option>
        </select>

        <div class="button-row">

            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

            <button
                type="button"
                class="cancel-button"
                onclick="document.getElementById('loginForm').reset()"
            >
                Cancel
            </button>

        </div>

    </form>

    <p id="loginMessage" class="message"></p>

    <div class="or">OR</div>

    <p class="account-text">
        Don't have an account?
    </p>

    <button
        class="primary-button full"
        onclick="location.href='capsignin.html'"
    >
        Create Account
    </button>

</div>

<script src="capscript.js"></script>

</body>
</html>
