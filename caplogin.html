<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yashz Mart - Login</title>

    <link rel="stylesheet" href="capstyle.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Yashz Mart</h1>

            <p class="subtitle">
                Your Customized Shopping Marketplace
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <div class="login-links">

                <p>
                    Don't have an account?
                </p>

                <a href="capsignin.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>

    <script src="capscript.js"></script>

</body>

</html>
