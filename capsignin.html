<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yashz Mart - Sign Up</title>

    <link rel="stylesheet" href="capstyle.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Yashz Mart</h1>

            <p class="subtitle">
                Create your account
            </p>

            <h2>Sign Up</h2>

            <form id="signupForm">

                <label for="signupName">
                    Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

                <label for="signupRole">
                    Account Type
                </label>

                <select id="signupRole">

                    <option value="BUYER">
                        Buyer
                    </option>

                    <option value="SELLER">
                        Seller
                    </option>

                </select>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

            </form>

            <p id="signupMessage"></p>

            <div class="login-links">

                <a href="caplogin.html">
                    Back to Login
                </a>

            </div>

        </div>

    </div>

    <script src="capscript.js"></script>

</body>

</html>
